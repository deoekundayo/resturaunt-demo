<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - ChefChain</title>
  <link rel="stylesheet" href="form-styles.css">
  <style>
    .forgot-password-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 100px);
      padding: 20px;
    }
    
    .forgot-password-form {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      max-width: 450px;
      padding: 40px;
      width: 100%;
    }
    
    .forgot-password-form h1 {
      margin-bottom: 30px;
      color: #333;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #444;
      font-weight: 600;
      text-align: left;
      font-family: "Times New Roman", serif;
    }
    
    .form-group input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      box-sizing: border-box;
      font-family: "Times New Roman", serif;
      font-size: 16px;
    }
    
    .form-group input[type="text"]:focus {
      border: 2px solid #4caf50;
      outline: none;
    }
    
    #message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 5px;
      text-align: center;
      font-family: "Times New Roman", serif;
      font-size: 14px;
    }
    
    .submit-button {
      width: 100%;
      padding: 12px;
      background-color: #4caf50;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      font-family: "Times New Roman", serif;
      transition: background-color 0.3s ease;
    }
    
    .submit-button:hover {
      background-color: #45a049;
    }
    
    .submit-button:active {
      transform: scale(0.98);
    }
    
    .cancel-button {
      width: 100%;
      padding: 12px;
      background-color: #333;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      font-family: "Times New Roman", serif;
      transition: background-color 0.3s ease;
      margin-top: 10px;
    }
    
    .cancel-button:hover {
      background-color: #555;
    }
    
    .cancel-button:active {
      transform: scale(0.98);
    }
    
    .success-message {
      background-color: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
      padding: 15px;
      border-radius: 5px;
      margin-top: 20px;
      font-family: "Times New Roman", serif;
    }
    
    .success-message p {
      margin: 5px 0;
    }
    
    @media (max-width: 480px) {
      .forgot-password-form {
        padding: 30px 20px;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="logo">
      <img src="chefchain-image.png" alt="ChefChain Logo" />
    </div>
    <div class="auth-buttons">
      <button class="signin" type="button" onclick="window.location.href='sign-in.html'">Sign In</button>
      <button class="signout" type="button" onclick="window.location.href='sign-in.html'">Sign Out</button>
    </div>
  </header>

  <div class="forgot-password-container">
    <form id="forgotPasswordForm" class="forgot-password-form">
      <h1>Forgot Password</h1>
      
      <div class="form-group">
        <label for="userId">User ID</label>
        <input 
          type="text" 
          id="userId" 
          name="userId" 
          placeholder="Enter your User ID" 
          required 
          autocomplete="username"
        />
      </div>
      
      <div id="message"></div>
      <div id="successMessage" class="success-message" style="display: none;"></div>
      
      <button type="submit" class="submit-button">Send Password to Email</button>
      <button type="button" onclick="window.location.href='sign-in.html'" class="cancel-button">Back to Sign In</button>
    </form>
  </div>

  <script src="JS/forgot-password.js"></script>
</body>
</html>
