<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=admindashbord.html">
    <title>ChefChain - Restaurant Management System</title>
    <style>
        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: radial-gradient(circle at top right, rgba(22, 163, 74, 0.22), transparent 50%), linear-gradient(180deg, #f4fbf6, #eaf6ec);
            color: #0f172a;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #dbe4ee;
            border-radius: 16px;
            box-shadow: 0 10px 28px rgba(15, 23, 42, 0.09);
            padding: 28px;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 14px;
        }
        p {
            font-size: 1.2em;
            margin-bottom: 16px;
            color: #475569;
        }
        a {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #16a34a, #15803d);
            color: #fff;
            text-decoration: none;
            border-radius: 999px;
            font-weight: bold;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        a:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 18px rgba(22, 163, 74, 0.25);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍽️ ChefChain</h1>
        <p>Welcome to the Restaurant Management System</p>
        <p>Redirecting to Admin Dashboard...</p>
        <a href="admindashbord.html">Enter Dashboard</a>
    </div>
</body>
</html>
