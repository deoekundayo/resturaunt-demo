<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - ChefChain</title>
  <link rel="stylesheet" href="form-styles.css">
  <style>
    .sign-in-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 120px);
      padding: 20px;
    }
    
    .sign-in-form {
      background: #fff;
      border: 1px solid #dbe4ee;
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.09);
      max-width: 450px;
      padding: 32px 30px;
      width: 100%;
    }
    
    .sign-in-form h1 {
      margin: 0 0 24px;
      color: #0f172a;
      width: 100%;
      max-width: none;
      display: block;
      text-align: center;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #475569;
      font-weight: 600;
      text-align: left;
    }
    
    .form-group input[type="text"],
    .form-group input[type="email"],
    .form-group input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #dbe4ee;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 15px;
    }
    
    .form-group input[type="text"]:focus,
    .form-group input[type="email"]:focus,
    .form-group input[type="password"]:focus {
      border-color: #16a34a;
      outline: none;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.16);
    }
    
    #message {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
    }
    
    .sign-in-button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    
    .sign-in-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 18px rgba(22, 163, 74, 0.25);
    }
    
    .sign-in-button:active {
      transform: scale(0.98);
    }
    
    .add-user-button {
      width: 100%;
      padding: 12px;
      background-color: #1f2937;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-top: 10px;
    }

    .sign-in-form .buttons p {
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sign-in-form .buttons button {
      width: 100%;
      margin: 0;
    }
    
    .add-user-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 18px rgba(15, 23, 42, 0.2);
    }
    
    .add-user-button:active {
      transform: scale(0.98);
    }
    
    .forgot-password-link {
      display: block;
      text-align: right;
      margin-top: 8px;
      margin-bottom: 0;
      color: #475569;
      font-size: 14px;
    }
    
    .forgot-password-link a {
      color: #0f172a;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    
    .forgot-password-link a:hover {
      text-decoration: underline;
    }
    
    @media (max-width: 480px) {
      .sign-in-form {
        padding: 30px 20px;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="logo">
      <img src="chefchain-image.png" alt="ChefChain Logo" />
    </div>
  </header>

  <div class="sign-in-container">
    <form id="signInForm" class="sign-in-form">
      <h1>User Login</h1>
      
      <div class="form-group">
        <label for="email">Email or User ID</label>
        <input 
          type="text" 
          id="email" 
          name="email" 
          placeholder="Enter your email or user ID" 
          required 
          autocomplete="username"
        />
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="Enter your password" 
          required 
          autocomplete="current-password"
        />
        <div class="forgot-password-link">
          <a href="#" id="forgotPasswordLink" onclick="event.preventDefault(); showForgotPasswordModal();">Forgot Password?</a> 
        </div>
      </div>
      
      <div id="message"></div>
      
      <div class="buttons">
        <p>
          <button type="button" class="add-user-button" onclick="window.location.href='form_user.html'">Add New User</button>
          <button type="submit" class="sign-in-button">Sign In</button>
        </p>
      </div>
    </form>
  </div>

  <script src="JS/authentication.js"></script>
  <script src="JS/email-templates.js"></script>
  <script src="JS/forgot-password-modal.js"></script>
</body>
</html>
