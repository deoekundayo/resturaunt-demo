<!DOCTYPE html>
<html>
  <head>
<meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <style>
    h1 {
      text-align: center;
      position: relative;
  display: inline-block;
  width: 100%;
margin-bottom: 40px}


    form {
      width: 500px;
      margin: 0 auto;
    }

    .form-row {
      display: grid;
      grid-template-columns: 150px 1fr;
      align-items: center;
      margin-bottom: 15px;
    }

    label {
      text-align: right;
      margin-right: 10px;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 6px;
      box-sizing: border-box;
    }

    .buttons {
      text-align: center;
      margin-top: 20px;
    }

    .buttons button {
      margin: 0 10px;
      padding: 8px 16px;
    }

.btn {
  display: inline-block;
  padding: 10px 18px;
  background-color: #4CAF50; 
  color: #fff;
  font-weight: bold;
  text-decoration: none;
  border-radius: 6px;
  transition: background 0.2s;
}

.btn:hover {
  background-color: #050505; 
}


body {
  font-family: Arial, sans-serif;
  background-color: #f5f6fa;
  color: #333;
}

input:focus, textarea:focus {
  border: 2px solid #4CAF50;
  outline: none;
  background-color: #fff;
}

form {
  background: #fff;
  padding: 20px 30px;
  border-radius: 10px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}


.buttons button {
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
}

button[type="submit"] {
  background-color: #4CAF50;
  color: white;
}

button[type="reset"] {
  background-color: #e74c3c;
  color: white;
}

.buttons button:hover {
  opacity: 0.9;
}


label {
  font-weight: bold;
  color: #444;
}

::placeholder {
  color: #999;
  font-style: italic;
}


input[type="checkbox"] {
  margin-left: 10px;
  transform: scale(1.2);
  cursor: pointer;
}

input, textarea, button {
  transition: all 0.2s ease-in-out;
}

/* Card grid */
.cards-grid {
  max-width: 1200px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
}

/* Individual card */
.card {
  background: #fff;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  text-align: center;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 8px 16px rgba(0,0,0,0.15);
}

.card h2 {
  margin-top: 0;
  margin-bottom: 15px;
  font-size: 1.2rem;
  color: #333;
}

.card a.btn {
  display: block;
  margin: 8px auto;
}



</style>
  </head>
  <body>
    <h1>Admin Dashboard</h1>
    
<form>

        View Food Items
      </a>
      <br />
      <a href="file:///Users/owner/Downloads/Food_Order_App/admin_view/add_fooditem.html" style="display:block; margin-bottom:-8px; text-align: center;" class="btn">

    </div>

    <div class="card">

        View Cuisines
      </a>
      <br />
      <a href="file:///Users/owner/Downloads/Food_Order_App/admin_view/add_cuisine.html" style="display:block; margin-bottom:-8px; text-align: center;" class="btn">
        Add Cuisine
      </a>
    </div>

    <div class="card">
      <h2 style="text-align: center;">3. Categories</h2>
      <a href="file:///Users/owner/Downloads/Food_Order_App/admin_view/list_categories.html" style="display:block; margin-bottom:-8px; text-align: center;" class="btn">
        View Categories
      </a>
      <br />
      <a href="file:///Users/owner/Downloads/Food_Order_App/admin_view/add_category.html" style="display:block; margin-bottom:-8px; text-align: center;" class="btn">
        Add Category
      </a>
    </div>

    <div class="card">
      <h2 style="text-align: center;">4. Orders</h2>
      <a href="file:///Users/owner/Downloads/Food_Order_App/admin_view/orders.html" style="display:block; margin-bottom:-8px; text-align: center;" class="btn">

      </a>
    </div>
  </body>
