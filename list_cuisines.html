<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuisines</title>
  <link rel="stylesheet" href="table.css">
  <link rel="stylesheet" href="back-to-top.css">
  <link rel="stylesheet" href="table-search.css">
</head>

<body>
  <header class="header">
    <div class="logo">
      <img src="chefchain-image.png" alt="ChefChain Logo"/>
    </div>
    <nav class="menu">
      <button class="menu-btn dropbtn" onclick="window.location.href='admindashbord.html'">Dashboard</button>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Food Items</button>
        <div class="dropdown-content">
          <a href="list_fooditems.html">View Food Items</a>
          <a href="form_fooditem.html">Add Food Item</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn active">Cuisines</button>
        <div class="dropdown-content">
          <a href="list_cuisines.html">View Cuisines</a>
          <a href="form_cuisine.html">Add Cuisine</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Categories</button>
        <div class="dropdown-content">
          <a href="list_categories.html">View Categories</a>
          <a href="form_category.html">Add Category</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Restaurants</button>
        <div class="dropdown-content">
          <a href="list_restaurants.html">View Restaurants</a>
          <a href="form_restaurant.html">Add Restaurant</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Orders</button>
        <div class="dropdown-content">
          <a href="orders.html">View Orders</a>
          <a href="form_order.html">Request Order</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Users</button>
        <div class="dropdown-content">
          <a href="users.html">View Users</a>
          <a href="form_user.html">Add User</a>
        </div>
      </div>
    </nav>
    <div class="auth-buttons">
      <button class="signin" type="button" onclick="window.location.href='sign-in.html'">Sign In</button>
      <button class="signout" type="button" onclick="window.location.href='sign-in.html'">Sign Out</button>
    </div>
  </header>

  <main class="main">
    <h1>All Cuisines</h1>
    <div class="table-search-wrap">
      <input type="text" class="table-search-input" id="table-search" placeholder="Search by cuisine name..." data-search-tbody="cuisines-tbody" data-search-col="1" aria-label="Search cuisines by name">
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Cuisine Number</th>
            <th>Cuisine Name</th>
            <th>Description</th>
            <th>Active</th>
            <th>Image</th>
            <th>Edit</th>
          </tr>
        </thead>

        <tbody id="cuisines-tbody">
          <!-- Populated from food items data -->
        </tbody>
      </table>
    </div>
  </main>

  <script src="JS/food-items-data.js"></script>
  <script>
    (function() {
      function escapeHtml(s) {
        var div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }
      var BASE = window.FOOD_ITEMS_BASE || [];
      var byCuisine = {};
      BASE.forEach(function(item) {
        var c = item.cuisine && String(item.cuisine).trim();
        if (!c) return;
        if (!byCuisine[c]) {
          byCuisine[c] = {
            name: c,
            description: 'All ' + c + ' cuisine items',
            imageUrl: item.img || '',
            imageAlt: item.alt || c,
            active: true
          };
        }
      });

      var defaultCuisines = Object.keys(byCuisine).sort().map(function(name, i) {
        return { id: i + 1, ...byCuisine[name] };
      });

      var saved = [];
      try {
        saved = JSON.parse(localStorage.getItem('cuisines') || '[]');
      } catch (e) {
        saved = [];
      }

      var byId = {};
      defaultCuisines.forEach(function(c) {
        byId[String(c.id)] = c;
      });
      saved.forEach(function(c) {
        if (!c || c.id == null) return;
        var key = String(c.id);
        var num = Number(c.id);
        var base = byId[key] || { id: num };
        var baseName = base.name ? String(base.name).trim() : '';
        var savedName = c.name ? String(c.name).trim() : '';
        var finalName = savedName || baseName || ('Cuisine ' + num);
        var baseDesc = base.description ? String(base.description).trim() : '';
        var savedDesc = c.description ? String(c.description).trim() : '';
        var finalDesc = savedDesc || baseDesc || ('All ' + finalName + ' cuisine items');
        var baseImage = base.imageUrl ? String(base.imageUrl).trim() : '';
        var savedImage = c.imageUrl ? String(c.imageUrl).trim() : '';
        byId[key] = {
          ...base,
          ...c,
          name: finalName,
          description: finalDesc,
          imageUrl: savedImage || baseImage,
          active: (typeof c.active === 'boolean')
            ? c.active
            : (typeof base.active === 'boolean' ? base.active : true)
        };
      });

      var cuisines = Object.keys(byId)
        .map(function(key) { return byId[key]; })
        .sort(function(a, b) { return Number(a.id) - Number(b.id); });

      var tbody = document.getElementById('cuisines-tbody');
      if (!tbody) return;
      cuisines.forEach(function(rec) {
        var num = Number(rec.id);
        var name = rec.name || ('Cuisine ' + num);
        var desc = rec.description || ('All ' + name + ' cuisine items');
        var active = rec.active ? 'Yes' : 'No';
        var imgSrc = rec.imageUrl || '';
        var imgAlt = rec.imageAlt || name;
        var imgHtml = imgSrc
          ? '<img src="' + imgSrc.replace(/"/g, '&quot;') + '" width="100" alt="' + imgAlt.replace(/"/g, '&quot;') + '" />'
          : '';
        var row = '<tr>' +
          '<td>' + num + '</td>' +
          '<td>' + escapeHtml(name) + '</td>' +
          '<td>' + escapeHtml(desc) + '</td>' +
          '<td>' + active + '</td>' +
          '<td>' + imgHtml + '</td>' +
          '<td class="buttons"><a href="form_cuisine.html?id=' + num + '"><button type="button">Edit</button></a></td>' +
          '</tr>';
        tbody.insertAdjacentHTML('beforeend', row);
      });
    })();
  </script>
  <script src="JS/table-search.js"></script>
  <script src="JS/back-to-top.js"></script>
  <script src="JS/auth-ui.js"></script>
</body>
</html>
