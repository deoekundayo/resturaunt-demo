<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cuisines</title>

  <style>
     h1 {
      text-align: center;
      position: relative;
  display: inline-block;
  width: 100%;
margin-bottom: -5px}


    

    form {
      width: 500px;
      margin: 40px auto;
  background: #fff;
  padding: 20px 30px;
  border-radius: 10px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .form-row {
      display: grid;
      grid-template-columns: 150px 1fr;
      align-items: center;
      margin-bottom: 15px;
    }

    label {
      text-align: right;
      margin-right: 10px;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 6px;
      box-sizing: border-box;
    }

    .buttons {
      text-align: center;
      margin-top: 20px;
    }


.buttons button {
  margin: 0 10px;
  padding: 8px 16px;
  background-color: #4CAF50; 
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
  transition: background-color 0.2s ease; 
}
  

.btn:hover {
  background-color: #050505; 
 transition: background 0.2s;}



body {
  font-family: Arial, sans-serif;
  background-color: #f5f6fa;
  color: #333;
}

input:focus, textarea:focus {
  border: 2px solid #4CAF50;
  outline: none;
  background-color: #fff;
}




.buttons button:hover {
  background-color: #050505; 
}

input, textarea, button {
  transition: all 0.2s ease-in-out;
}

    .table-container {
      background: #fff;
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: fit-content;
      max-width: 1000%;
      margin: 40px auto 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: auto;
    }

    th, td {
      border: 1px solid black;
      padding: 8px;
      vertical-align: top;
      text-align: left;
    }

    td img {
      max-width: 300px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    td:nth-child(2), 
    th:nth-child(2) {
      width: 100px;
    }

    button {
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      padding: 8px 16px;
      background-color: #4CAF50;
      color: white;
      transition: all 0.2s ease-in-out;
    }

    button:hover {
background-color: #050505;
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <h1>All Cuisines</h1>
  
  <div class="table-container">
    <table>
    <thead>
      <tr>
        <th>Cuisine Number</th>
        <th>Cuisine Name</th>
        <th>Active</th>
        <th>Image</th>
        <th>Edit</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>1</td>
        <td>All Italian food</td>
        <td>Yes</td>
        <td>
          <img src="https://static.wixstatic.com/media/2cbff6_ac782b0eaff94ec0881f0299fdb76ab6~mv2.jpg/v1/fill/w_528,h_410,al_c,q_80,usm_0.66_1.00_0.01,enc_avif,quality_auto/2cbff6_ac782b0eaff94ec0881f0299fdb76ab6~mv2.jpg" />
        </td>
<div class="buttons">
        <td><button type="button">Edit</button></td>
      </tr>

      <tr>
        <td>2</td>
        <td>All American food</td>
        <td>Yes</td>
        <td>
          <img src="https://res.cloudinary.com/hz3gmuqw6/image/upload/c_fill,f_auto,q_60,w_750/v1/classpop/679a768f61781" />
        </td>
<div class="buttons">
        <td><button type="button">Edit</button></td>
      </tr>

      <tr>
        <td>3</td>
        <td>All Nigerian food</td>
        <td>Yes</td>
        <td>
          <img src="https://blog.remitly.com/wp-content/uploads/2022/09/different-Nigerian-dishes.jpeg" />
        </td>
<div class="buttons">
        <td><button type="button">Edit</button></td>
      </tr>

      <tr>
        <td>4</td>
        <td>All Chinese food</td>
        <td>Yes</td>
        <td>
          <img src="https://hips.hearstapps.com/hmg-prod/images/chinese-food-68602c98ca7ab.jpg" />
        </td>
<div class="buttons">
        <td><button type="button">Edit</button></td>
      </tr>
    </tbody>
    </table>
  </div>
</body>
</html>
