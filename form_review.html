<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurant Review</title>
  <link rel="stylesheet" href="form-styles.css">
</head>

<body>
  <header class="header">
    <div class="logo">
      <img src="chefchain-image.png" alt="ChefChain Logo" />
    </div>
    <nav class="menu">
      <button class="menu-btn dropbtn" onclick="window.location.href='admindashbord.html'">Dashboard</button>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Food Items</button>
        <div class="dropdown-content">
          <a href="list_fooditems.html">View Food Items</a>
          <a href="form_fooditem.html">Add Food Item</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Cuisines</button>
        <div class="dropdown-content">
          <a href="list_cuisines.html">View Cuisines</a>
          <a href="form_cuisine.html">Add Cuisine</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Categories</button>
        <div class="dropdown-content">
          <a href="list_categories.html">View Categories</a>
          <a href="form_category.html">Add Category</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Restaurants</button>
        <div class="dropdown-content">
          <a href="list_restaurants.html">View Restaurants</a>
          <a href="form_restaurant.html">Add Restaurant</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Orders</button>
        <div class="dropdown-content">
          <a href="orders.html">View Orders</a>
          <a href="form_order.html">Request Order</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn active">Reviews</button>
        <div class="dropdown-content">
          <a href="form_review.html">Leave a Review</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Users</button>
        <div class="dropdown-content">
          <a href="users.html">View Users</a>
          <a href="form_user.html">Add User</a>
        </div>
      </div>
    </nav>

    <div class="auth-buttons">
      <button class="signin" type="button" onclick="window.location.href='sign-in.html'">Sign In</button>
      <button class="signout" type="button" onclick="window.location.href='sign-in.html'">Sign Out</button>
    </div>
  </header>

  <h1>Restaurant Review</h1>

  <form id="review-form">
    <div class="form">
      <p>
        <label for="rating">Rating (0–5 stars)</label>
      </p>
      <p class="star-rating-wrapper" aria-label="Rate from 0 to 5 stars">
        <span class="star-rating" role="group" aria-label="Star rating">
          <button type="button" class="star-btn" data-value="1" aria-label="1 star" title="1 star">☆</button>
          <button type="button" class="star-btn" data-value="2" aria-label="2 stars" title="2 stars">☆</button>
          <button type="button" class="star-btn" data-value="3" aria-label="3 stars" title="3 stars">☆</button>
          <button type="button" class="star-btn" data-value="4" aria-label="4 stars" title="4 stars">☆</button>
          <button type="button" class="star-btn" data-value="5" aria-label="5 stars" title="5 stars">☆</button>
        </span>
        <button type="button" class="star-clear" id="star-clear" aria-label="Clear rating">Clear (0)</button>
        <input type="hidden" id="rating" name="rating" value="0" />
        <span class="star-rating-label" id="rating-label">0 of 5 stars</span>
      </p>
    </div>

    <div class="form">
      <p>
        <label for="comment">Your comment</label>
        <textarea id="comment" name="comment" placeholder="Share your experience—food, service, atmosphere…" rows="5" cols="40" style="font-family: 'Times New Roman', serif;"></textarea>
      </p>
    </div>

    <div class="form">
      <fieldset class="recommend-fieldset">
        <legend>Are you likely to recommend any of our restaurants to a friend?</legend>
        <p class="radio-group">
          <label class="radio-label">
            <input type="radio" name="recommend" value="Very much certainly" />
            Very much certainly
          </label>
          <label class="radio-label">
            <input type="radio" name="recommend" value="Certainly" />
            Certainly
          </label>
          <label class="radio-label">
            <input type="radio" name="recommend" value="Uncertain" />
            Uncertain
          </label>
          <label class="radio-label">
            <input type="radio" name="recommend" value="Not at all" />
            Not at all
          </label>
        </p>
      </fieldset>
    </div>

    <div class="buttons">
      <p>
        <button type="reset">Clear</button>
        <button type="submit">Submit Review</button>
      </p>
    </div>
  </form>

  <script src="JS/review-form.js"></script>
</body>
</html>
