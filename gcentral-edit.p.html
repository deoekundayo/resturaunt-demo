  <form action="info-saved.html" method="post">
  <h1>Edit Restaurant</h1>
  

  <form id="survey-form">
    
    <div class="form">
      <p>
        <label for="name">Restaurant Name</label>
        <input id="name" type="text" value="Gourmet Central" required style="font-family: 'Times New Roman', serif;"/>
      </p>
    </div>

    <div class="form">
      <p>
        <label for="address">Restaurant Address</label>
        <input id="address" type="text"" value="2863 Baylor street Greensboro, NC" required style="font-family: 'Times New Roman', serif;"/>
      </p>
    </div>

    <div class="form">
      <p>
        <label for="image-url">Image URL</label>
        <input id="image-url" type="url" name="image-url" style="font-family: 'Times New Roman', serif;" value="https://commonmarketrestaurants.com/wp-content/uploads/2024/03/BALLAST-13.jpg"/>
      </p>
    </div>

    <div class="form">
      <p>
        <label for="phone-number">Phone Number</label>
        <input id="phone-number" type="tel" maxlength="14" value="(336) 824-8482" required style="font-family: 'Times New Roman', serif;"/>
<script>
document.getElementById("phone-number").addEventListener("input", function(e) {
  let x = e.target.value.replace(/\D/g, ""); // remove all non-digits
  if (x.length > 0) {
    x = "(" + x;
  }
  if (x.length > 4) {
    x = x.slice(0, 4) + ")-" + x.slice(4);
  }
  if (x.length > 9) {
    x = x.slice(0, 9) + "-" + x.slice(9);
  }
  if (x.length > 14) {
    x = x.slice(0, 14);
  }
  e.target.value = x;
});
</script>
      </p>
    
      </p>
    </div>

    <div class="buttons">
      <p>
        <button type="reset">Discard</button>
        <button type="submit">Save</button>
      </p>
    </div>

  </form>
