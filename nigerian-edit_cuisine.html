<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit Cuisine</title>
  <link rel="stylesheet" href="form-styles.css">
</head>

<body>
  <header class="header">
    <div class="logo">
      <img src="chefchain-image.png" alt="ChefChain Logo" />
    </div>
    <nav class="menu">
      <button class="menu-btn dropbtn" onclick="window.location.href='admindashbord.html'">Dashboard</button>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Food Items</button>
        <div class="dropdown-content">
          <a href="list_fooditems.html">View Food Items</a>
          <a href="add_fooditem.html">Add Food Item</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn active">Cuisines</button>
        <div class="dropdown-content">
          <a href="list_cuisines.html">View Cuisines</a>
          <a href="add_cuisine.html">Add Cuisine</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Categories</button>
        <div class="dropdown-content">
          <a href="list_categories.html">View Categories</a>
          <a href="add_category.html">Add Category</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Restaurants</button>
        <div class="dropdown-content">
          <a href="list_restaurants.html">View Restaurants</a>
          <a href="add_restaurant.html">Add Restaurant</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Orders</button>
        <div class="dropdown-content">
          <a href="orders.html">View Orders</a>
          <a href="order-request.html">Request Order</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Users</button>
        <div class="dropdown-content">
          <a href="users.html">View Users</a>
          <a href="add_user.html">Add User</a>
        </div>
      </div>
    </nav>
    <div class="auth-buttons">
      <button class="signin" type="button">Sign In</button>
      <button class="signout" type="button">Sign Out</button>
    </div>
  </header>

  <h1>Edit Cuisine</h1>

  <form action="info-saved.html" method="post" id="survey-form">
    <div class="form">
      <p>
        <label for="name">Cuisine Name</label>
        <input id="name" type="text" value="Nigerian" required style="font-family:'Times New Roman', serif;"/>
      </p>
    </div>

    <div class="form">
      <p>
        <label for="description">Cuisine Description</label>
        <input id="description" type="text" value="All Nigerian" style="font-family: 'Times New Roman', serif;" required/>
      </p>
    </div>

    <div class="form">
      <p>
        <label for="image-url">Image URL</label>
        <input id="image-url" type="url" style="font-family: 'Times New Roman', serif;" value="https://blog.remitly.com/wp-content/uploads/2022/09/different-Nigerian-dishes.jpeg" size="40" />
      </p>
    </div>

    <div class="form">
      <p>
        <label for="yes-active">Is this cuisine currently active?</label>
        <input id="yes-active" type="radio" value="yes-active" name="active" required />
        <label for="yes-active" style="font-weight: normal;">Yes</label>
        <input id="no-active" type="radio" value="no-active" name="active" checked/>
        <label for="no-active" style="font-weight: normal;">No</label>
      </p>
    </div>

    <div class="buttons">
      <p>
        <button type="reset">Discard</button>
        <button type="submit">Save</button>
      </p>
    </div>
  </form>
</body>
</html>
