<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Category Form</title>
  <link rel="stylesheet" href="form-styles.css">
</head>

<body>
  <header class="header">
    <div class="logo">
      <img src="chefchain-image.png" alt="ChefChain Logo" />
    </div>
    <nav class="menu">
      <button class="menu-btn dropbtn" onclick="window.location.href='admindashbord.html'">Dashboard</button>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Food Items</button>
        <div class="dropdown-content">
          <a href="list_fooditems.html">View Food Items</a>
          <a href="form_fooditem.html">Add Food Item</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Cuisines</button>
        <div class="dropdown-content">
          <a href="list_cuisines.html">View Cuisines</a>
          <a href="form_cuisine.html">Add Cuisine</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn active">Categories</button>
        <div class="dropdown-content">
          <a href="list_categories.html">View Categories</a>
          <a href="form_category.html">Add Category</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Restaurants</button>
        <div class="dropdown-content">
          <a href="list_restaurants.html">View Restaurants</a>
          <a href="form_restaurant.html">Add Restaurant</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Orders</button>
        <div class="dropdown-content">
          <a href="orders.html">View Orders</a>
          <a href="form_order.html">Request Order</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Users</button>
        <div class="dropdown-content">
          <a href="users.html">View Users</a>
          <a href="form_user.html">Add User</a>
        </div>
      </div>
    </nav>

    <div class="auth-buttons">
      <button class="signin" type="button" onclick="window.location.href='sign-in.html'">Sign In</button>
      <button class="signout" type="button" onclick="window.location.href='sign-in.html'">Sign Out</button>
    </div>
  </header>

  <h1>Add Food Category</h1>

  <form id="survey-form">
    <div class="form">
      <p>
        <label for="name">Category Name</label>
        <input id="name" type="text" placeholder="Enter name here" style="font-family: 'Times New Roman', serif;" required/>
      </p>
    </div>

    <div class="form">
      <p>
        <label for="description">Category Description</label>
        <textarea id="description" name="description" placeholder="Enter description here" rows="2" cols="40" style="font-family: 'Times New Roman', serif;" required></textarea>
      </p>
    </div>

    <div class="form">
      <p>
        <label for="image-url">Image URL</label>
        <input id="image-url" type="url" placeholder="Enter URL here" size="40" style="font-family: 'Times New Roman', serif;" />
      </p>
    </div>

    <div class="form">
      <p>
        <label for="active">Is this category active?</label>
        <input id="yes-active" type="radio" value="Active" name="active" required/>
        <label for="yes-active" style="font-weight: normal;">Yes</label>
        <input id="no-active" type="radio" value="Inactive" name="active" />
        <label for="no-active" style="font-weight: normal;">No</label>
      </p>
    </div>

    <div class="buttons">
      <p>
        <button type="reset">Delete</button>
        <button type="submit">Save</button>
      </p>
    </div>
  </form>

  <script src="JS/utils.js"></script>
  <script src="JS/form-handlers.js"></script>
  <script>
    handleCategoryForm();
  </script>
</body>
</html>
