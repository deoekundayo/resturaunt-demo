<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories</title>
  <link rel="stylesheet" href="table.css">
  <link rel="stylesheet" href="back-to-top.css">
  <link rel="stylesheet" href="table-search.css">
</head>

<body>
  <header class="header">
    <div class="logo">
      <img src="chefchain-image.png" alt="ChefChain Logo"/>
    </div>
    <nav class="menu">
      <button class="menu-btn dropbtn" onclick="window.location.href='admindashbord.html'">Dashboard</button>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Food Items</button>
        <div class="dropdown-content">
          <a href="list_fooditems.html">View Food Items</a>
          <a href="add_fooditem.html">Add Food Item</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Cuisines</button>
        <div class="dropdown-content">
          <a href="list_cuisines.html">View Cuisines</a>
          <a href="add_cuisine.html">Add Cuisine</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn active">Categories</button>
        <div class="dropdown-content">
          <a href="list_categories.html">View Categories</a>
          <a href="form_category.html">Add Category</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Restaurants</button>
        <div class="dropdown-content">
          <a href="list_restaurants.html">View Restaurants</a>
          <a href="add_restaurant.html">Add Restaurant</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Orders</button>
        <div class="dropdown-content">
          <a href="orders.html">View Orders</a>
          <a href="order-request.html">Request Order</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Users</button>
        <div class="dropdown-content">
          <a href="users.html">View Users</a>
          <a href="add_user.html">Add User</a>
        </div>
      </div>
    </nav>
    <div class="auth-buttons">
      <button class="signin" type="button" onclick="window.location.href='sign-in.html'">Sign In</button>
      <button class="signout" type="button" onclick="window.location.href='sign-in.html'">Sign Out</button>
    </div>
  </header>

  <main class="main">
    <h1>All Categories</h1>
    <div class="table-search-wrap">
      <input type="text" class="table-search-input" id="table-search" placeholder="Search by category name..." data-search-tbody="categories-tbody" data-search-col="1" aria-label="Search categories by name">
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Category Number</th>
            <th>Category Name</th>
            <th>Description</th>
            <th>Active</th>
            <th>Image</th>
            <th>Edit</th>
          </tr>
        </thead>
        <tbody id="categories-tbody">
          <!-- Populated from food items data -->
        </tbody>
      </table>
    </div>
  </main>

  <script src="JS/food-items-data.js"></script>
  <script>
    (function() {
      function escapeHtml(s) {
        var div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }
      var BASE = window.FOOD_ITEMS_BASE || [];
      var byCat = {};
      BASE.forEach(function(item) {
        var c = item.cat && String(item.cat).trim();
        if (!c) return;
        if (!byCat[c]) byCat[c] = { name: c, img: item.img || '', alt: item.alt || c };
      });
      var names = Object.keys(byCat).sort();
      var tbody = document.getElementById('categories-tbody');
      if (!tbody) return;
      names.forEach(function(name, i) {
        var rec = byCat[name];
        var num = i + 1;
        var desc = 'All ' + name + ' items';
        var imgSrc = rec.img || '';
        var imgAlt = rec.alt || name;
        var imgHtml = imgSrc
          ? '<img src="' + imgSrc.replace(/"/g, '&quot;') + '" width="100" alt="' + imgAlt.replace(/"/g, '&quot;') + '" />'
          : '';
        var row = '<tr>' +
          '<td>' + num + '</td>' +
          '<td>' + escapeHtml(name) + '</td>' +
          '<td>' + escapeHtml(desc) + '</td>' +
          '<td>Yes</td>' +
          '<td>' + imgHtml + '</td>' +
          '<td class="buttons"><a href="form_category.html?id=' + num + '"><button type="button">Edit</button></a></td>' +
          '</tr>';
        tbody.insertAdjacentHTML('beforeend', row);
      });
    })();
  </script>
  <script src="JS/table-search.js"></script>
  <script src="JS/back-to-top.js"></script>
</body>
</html>
