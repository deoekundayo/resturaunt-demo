<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Catagories</title>
  <style>
        h1 {
      text-align: center;
      position: relative;
  display: inline-block;
  width: 100%;
margin-bottom: -5px}


    

    form {
      width: 500px;
      margin: 40px auto;
    }

    .form-row {
      display: grid;
      grid-template-columns: 150px 1fr;
      align-items: center;
      margin-bottom: 15px;
    }

    label {
      text-align: right;
      margin-right: 10px;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 6px;
      box-sizing: border-box;
    }

    .buttons {
      text-align: center;
      margin-top: 20px;
    }

    .buttons button {
      margin: 0 10px;
      padding: 8px 16px;
    background-color: #4CAF50;}

.btn:hover {
  background-color: #050505; 
 transition: background 0.2s;}



body {
  font-family: Arial, sans-serif;
  background-color: #f5f6fa;
  color: #333;
}

input:focus, textarea:focus {
  border: 2px solid #4CAF50;
  outline: none;
  background-color: #fff;
}

form {
  background: #fff;
  padding: 20px 30px;
  border-radius: 10px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

.buttons button {
  margin: 0 10px;
  padding: 8px 16px;
  background-color: #4CAF50; 
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
  transition: background-color 0.2s ease; 
}

.buttons button:hover {
  background-color: #050505; 
}




input, textarea, button {
  transition: all 0.2s ease-in-out;
}
    .table-container {
      background: #fff;
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: fit-content;
      max-width: 90%;
      margin: 40px auto 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: auto;
    }

    th, td {
      border: 1px solid black;
      padding: 8px;
      vertical-align: top;
      text-align: left;
    }

    td img {
      max-width: 300px;
      height: auto;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <h1>All Catagories</h1>
  
  <div class="table-container">

    <thead>
      <tr>

    </thead>
    <tbody>
      <tr>

        </td>
        <td>
<div class="buttons">
<button type="button">Edit</button>
		</td>
	  </div>

      <tr>

<div class="buttons">
<button type="button">Edit</button></td>
	  </div>

      <tr>
        <td>4</td>

          <img src="https://www.gelq.it/modules/ybc_blog/views/img/post/MS_POST.jpg" />

    </tbody>
    </table>
  </div>

</html>
