<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit Food Item</title>
  <link rel="stylesheet" href="edit-id.css">
</head>

<body>
  <header class="header">
    <div class="logo">
      <img src="chefchain-image.png" alt="ChefChain Logo" />
    </div>
    <nav class="menu">
      <button class="menu-btn dropbtn" onclick="window.location.href='admindashbord.html'">Dashboard</button>

      <div class="dropdown">
        <button class="menu-btn dropbtn active">Food Items</button>
        <div class="dropdown-content">
          <a href="list_fooditems.html">View Food Items</a>
          <a href="add_fooditem.html">Add Food Item</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Cuisines</button>
        <div class="dropdown-content">
          <a href="list_cuisines.html">View Cuisines</a>
          <a href="add_cuisine.html">Add Cuisine</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Categories</button>
        <div class="dropdown-content">
          <a href="list_categories.html">View Categories</a>
          <a href="add_category.html">Add Category</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Restaurants</button>
        <div class="dropdown-content">
          <a href="list_restaurants.html">View Restaurants</a>
          <a href="add_restaurant.html">Add Restaurant</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Orders</button>
        <div class="dropdown-content">
          <a href="orders.html">View Orders</a>
          <a href="order-request.html">Request Order</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Users</button>
        <div class="dropdown-content">
          <a href="users.html">View Users</a>
          <a href="add_user.html">Add User</a>
        </div>
      </div>
    </nav>
    <div class="auth-buttons">
      <button class="signin" type="button">Sign In</button>
      <button class="signout" type="button">Sign Out</button>
    </div>
  </header>

  <h1>Edit Food Item</h1>

  <form action="info-saved.html" method="post" id="survey-form">
    <div class="form">
      <p>
        <label for="name">Food Item Name</label>
        <input id="name" type="text" value="Pepperoni Pizza" required style="font-family: 'Times New Roman', serif;"/>
      </p>
    </div>

    <div class="form">
      <p>
        <label for="description">Food Item Description</label>
        <textarea id="description" name="description" rows="2" cols="40" required style="font-family: 'Times New Roman', serif;">A classic favorite topped with rich tomato sauce, melted mozzarella cheese, and generous slices of spicy pepperoni.</textarea>
      </p>
    </div>

    <div class="form">
      <p>
        <label for="image-url">Image URL</label>
        <input id="image-url" type="url" value="https://encrypted-tbn2.gstatic.com/shopping?q=tbn:ANd9GcRDyJEalW-IRBh84gsK2fYUAUhWTgBjSK8WyD62a7Q7UgyEdg-yunD5cZNmJn23BGetNNsAnG6AGF4bfPU4Le5VcwkBIUhK5iqZRbdzAUUb&usqp=CAc" style="font-family: 'Times New Roman', serif;" size="40"/>
      </p>
    </div>

    <div class="form">
      <p>
        <label for="category">Category</label>
        <input id="category" type="text" value="Pizza" required style="font-family: 'Times New Roman', serif;"/>
      </p>
    </div>

    <div class="form">
      <p>
        <label for="cuisine">Cuisine</label>
        <input id="cuisine" type="text" value="Italian" required style="font-family: 'Times New Roman', serif;"/>
      </p>
    </div>

    <div class="form">
      <p>
        <label for="availability">Is this item currently available?</label>
        <input id="availability-yes" type="radio" value="yes" name="availability" required checked/>
        <label for="availability-yes" style="font-weight: normal;">Yes</label>
        <input id="availability-no" type="radio" value="no" name="availability" />
        <label for="availability-no" style="font-weight: normal;">No</label>
      </p>
    </div>

    <div class="form">
      <p>
        <label for="vegetarian">Does this item have a vegetarian option?</label>
        <input id="veg-yes" type="radio" value="yes" name="vegetarian" required />
        <label for="veg-yes" style="font-weight: normal;">Yes</label>
        <input id="veg-no" type="radio" value="no" name="vegetarian" checked/>
        <label for="veg-no" style="font-weight: normal;">No</label>
      </p>
    </div>

    <div class="buttons">
      <p>
        <button type="reset">Discard</button>
        <button type="submit">Save</button>
      </p>
    </div>
  </form>
</body>
</html>
