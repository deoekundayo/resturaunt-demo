<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders</title>
  <link rel="stylesheet" href="table.css">
  <link rel="stylesheet" href="back-to-top.css">
  <link rel="stylesheet" href="table-search.css">
</head>

<body>
  <header class="header">
    <div class="logo">
      <img src="chefchain-image.png" alt="ChefChain Logo"/>
    </div>
    <nav class="menu">
      <button class="menu-btn dropbtn" onclick="window.location.href='admindashbord.html'">Dashboard</button>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Food Items</button>
        <div class="dropdown-content">
          <a href="list_fooditems.html">View Food Items</a>
          <a href="add_fooditem.html">Add Food Item</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Cuisines</button>
        <div class="dropdown-content">
          <a href="list_cuisines.html">View Cuisines</a>
          <a href="add_cuisine.html">Add Cuisine</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Categories</button>
        <div class="dropdown-content">
          <a href="list_categories.html">View Categories</a>
          <a href="add_category.html">Add Category</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Restaurants</button>
        <div class="dropdown-content">
          <a href="list_restaurants.html">View Restaurants</a>
          <a href="add_restaurant.html">Add Restaurant</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn active">Orders</button>
        <div class="dropdown-content">
          <a href="orders.html">View Orders</a>
          <a href="form_order.html">Request Order</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Users</button>
        <div class="dropdown-content">
          <a href="users.html">View Users</a>
          <a href="add_user.html">Add User</a>
        </div>
      </div>
    </nav>
    <div class="auth-buttons">
      <button class="signin" type="button" onclick="window.location.href='sign-in.html'">Sign In</button>
      <button class="signout" type="button" onclick="window.location.href='sign-in.html'">Sign Out</button>
    </div>
  </header>

  <main class="main">
    <h1>Orders</h1>
    <div class="table-search-wrap">
      <input type="text" class="table-search-input" id="table-search" placeholder="Search by Order ID, User/Client ID, or date..." data-search-tbody="orders-tbody" data-search-col="1,2,7" aria-label="Search orders by Order ID, User/Client ID, or date">
    </div>
    <div class="table-filter-wrap">
      <label for="orders-status-filter" class="table-filter-label">Filter by status:</label>
      <select id="orders-status-filter" class="table-filter-select" aria-label="Filter orders by status">
        <option value="">All</option>
        <option value="Delivered">Delivered</option>
        <option value="Processing">Processing</option>
        <option value="Pending">Pending</option>
        <option value="Shipped">Shipped</option>
      </select>
    </div>
    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th>S.No</th>
            <th>Order ID</th>
            <th>Order Date</th>
            <th>Order Status</th>
            <th>Quantity</th>
            <th>Order Value</th>
            <th>View/Edit</th>
            <th>User/Client Id</th>
          </tr>
        </thead>
        <tbody id="orders-tbody">
        </tbody>
      </table>
    </div>
  </main>
  <script src="JS/users-data.js"></script>
  <script src="JS/orders-data.js"></script>
  <script>
    (function() {
      var tbody = document.getElementById('orders-tbody');
      if (!tbody) return;
      var total = window.ORDERS_TOTAL || 1284;
      for (var i = 1; i <= total; i++) {
        var order = window.getOrderById(i);
        if (!order) continue;
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + i + '</td>' +
          '<td>' + order.orderId + '</td>' +
          '<td>' + order.dateStr + '</td>' +
          '<td>' + order.status + '</td>' +
          '<td>' + order.qty + '</td>' +
          '<td>' + order.valueFormatted + '</td>' +
          '<td class="buttons"><a href="form_order.html?id=' + i + '"><button type="button">👁 ✏️</button></a></td>' +
          '<td>' + order.clientId + '</td>';
        tbody.appendChild(tr);
      }
    })();
  </script>
  <script src="JS/table-search.js"></script>
  <script src="JS/orders-status-filter.js"></script>
  <script src="JS/back-to-top.js"></script>
</body>
</html>
