<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders</title>
  <link rel="stylesheet" href="table.css">
</head>

<body>
  <header class="header">
    <div class="logo">
      <img src="chefchain-image.png" alt="ChefChain Logo"/>
    </div>
    <nav class="menu">
      <button class="menu-btn dropbtn" onclick="window.location.href='admindashbord.html'">Dashboard</button>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Food Items</button>
        <div class="dropdown-content">
          <a href="list_fooditems.html">View Food Items</a>
          <a href="add_fooditem.html">Add Food Item</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Cuisines</button>
        <div class="dropdown-content">
          <a href="list_cuisines.html">View Cuisines</a>
          <a href="add_cuisine.html">Add Cuisine</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Categories</button>
        <div class="dropdown-content">
          <a href="list_categories.html">View Categories</a>
          <a href="add_category.html">Add Category</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Restaurants</button>
        <div class="dropdown-content">
          <a href="list_restaurants.html">View Restaurants</a>
          <a href="add_restaurant.html">Add Restaurant</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn active">Orders</button>
        <div class="dropdown-content">
          <a href="orders.html">View Orders</a>
          <a href="form_order.html">Request Order</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Users</button>
        <div class="dropdown-content">
          <a href="users.html">View Users</a>
          <a href="add_user.html">Add User</a>
        </div>
      </div>
    </nav>
    <div class="auth-buttons">
      <button class="signin" type="button" onclick="window.location.href='sign-in.html'">Sign In</button>
      <button class="signout" type="button" onclick="window.location.href='sign-in.html'">Sign Out</button>
    </div>
  </header>

  <main class="main">
    <h1>Orders</h1>

    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th>S.No</th>
            <th>Order ID</th>
            <th>Order Date</th>
            <th>Order Status</th>
            <th>Quantity</th>
            <th>Order Value</th>
            <th>View/Edit</th>
            <th>User/Client Id</th>
          </tr>
        </thead>
        <tbody id="orders-tbody">
        </tbody>
      </table>
    </div>
  </main>
  <script>
    (function() {
      const AVG_ORDER_VALUE = 22.40;
      const TOTAL_ORDERS = 1284;
      const STATUSES = ['Delivered', 'Delivered', 'Delivered', 'Processing', 'Pending', 'Shipped'];
      const tbody = document.getElementById('orders-tbody');
      if (!tbody) return;

      function randomInRange(min, max) {
        return min + Math.random() * (max - min);
      }
      function formatDollars(n) {
        return '$' + n.toFixed(2);
      }
      function pad(n, len) {
        return String(n).padStart(len, '0');
      }
      function randomClientId() {
        return pad(Math.floor(randomInRange(200000, 399999)), 6);
      }

      var sum = 0;
      for (var i = 1; i <= TOTAL_ORDERS; i++) {
        var value = randomInRange(AVG_ORDER_VALUE - 6, AVG_ORDER_VALUE + 6);
        value = Math.round(value * 100) / 100;
        sum += value;
        var date = new Date();
        date.setDate(date.getDate() - Math.floor(Math.random() * 30));
        var dateStr = date.toISOString().slice(0, 10);
        var status = STATUSES[Math.floor(Math.random() * STATUSES.length)];
        var qty = Math.floor(randomInRange(1, 8));
        var orderId = 'ORD' + pad(i, 4);
        var clientId = randomClientId();

        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + i + '</td>' +
          '<td>' + orderId + '</td>' +
          '<td>' + dateStr + '</td>' +
          '<td>' + status + '</td>' +
          '<td>' + qty + '</td>' +
          '<td>' + formatDollars(value) + '</td>' +
          '<td class="buttons"><a href="form_order.html?id=' + i + '"><button type="button">👁 ✏️</button></a></td>' +
          '<td>' + clientId + '</td>';
        tbody.appendChild(tr);
      }
    })();
  </script>
</body>
</html>
