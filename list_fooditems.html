<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Items</title>
  <link rel="stylesheet" href="food-item-table.css">
  <link rel="stylesheet" href="back-to-top.css">
  <link rel="stylesheet" href="table-search.css">
  <script src="JS/food-items-data.js"></script>
</head>

<body>
  <header class="header">
    <div class="logo">
      <img src="chefchain-image.png" alt="ChefChain Logo"/>
    </div>
    <nav class="menu">
      <button class="menu-btn dropbtn" onclick="window.location.href='admindashbord.html'">Dashboard</button>

      <div class="dropdown">
        <button class="menu-btn dropbtn active">Food Items</button>
        <div class="dropdown-content">
          <a href="list_fooditems.html">View Food Items</a>
          <a href="form_fooditem.html">Add Food Item</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Cuisines</button>
        <div class="dropdown-content">
          <a href="list_cuisines.html">View Cuisines</a>
          <a href="add_cuisine.html">Add Cuisine</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Categories</button>
        <div class="dropdown-content">
          <a href="list_categories.html">View Categories</a>
          <a href="add_category.html">Add Category</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Restaurants</button>
        <div class="dropdown-content">
          <a href="list_restaurants.html">View Restaurants</a>
          <a href="add_restaurant.html">Add Restaurant</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Orders</button>
        <div class="dropdown-content">
          <a href="orders.html">View Orders</a>
          <a href="order-request.html">Request Order</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Users</button>
        <div class="dropdown-content">
          <a href="users.html">View Users</a>
          <a href="add_user.html">Add User</a>
        </div>
      </div>
    </nav>
    <div class="auth-buttons">
      <button class="signin" type="button" onclick="window.location.href='sign-in.html'">Sign In</button>
      <button class="signout" type="button" onclick="window.location.href='sign-in.html'">Sign Out</button>
    </div>
  </header>

  <main class="main">
    <h1>Food Items</h1>
    <div class="table-search-wrap">
      <input type="text" class="table-search-input" id="table-search" placeholder="Search by item name..." data-search-tbody="food-items-tbody" data-search-col="1" aria-label="Search food items by name">
    </div>
    <div class="table-container">
      <table class="food-items-table">
        <colgroup>
          <col style="width:90px;">
          <col class="col-name">
          <col style="width:280px;">
          <col style="width:100px;">
          <col style="width:100px;">
          <col style="width:100px;">
          <col style="width:100px;">
          <col style="width:80px;">
          <col style="width:120px;">
          <col style="width:80px;">
        </colgroup>
        <thead>
          <tr>
            <th>Food Item Number</th>
            <th class="th-name">Name</th>
            <th>Description</th>
            <th>Available?</th>
            <th>Vegetarian Option?</th>
            <th>Category</th>
            <th>Cuisine</th>
            <th>Price</th>
            <th>Image</th>
            <th>Edit</th>
          </tr>
        </thead>
        <tbody id="food-items-tbody">
        </tbody>
      </table>
    </div>
  </main>
  <script>
    (function() {
      var TOTAL = window.FOOD_ITEMS_TOTAL || 98;
      var AVAILABLE_COUNT = window.FOOD_ITEMS_AVAILABLE_COUNT || 86;
      var BASE = window.FOOD_ITEMS_BASE || [];
      var tbody = document.getElementById('food-items-tbody');
      if (!tbody) return;

      var cats = ['Entrée', 'Sides', 'Salad', 'Pasta', 'Burger', 'Pizza', 'Sandwich', 'Appetizer', 'Dessert', 'Drinks', 'Seafood', 'Noodles', 'Sushi', 'Mexican'];
      var cuisines = ['American', 'Italian', 'Asian', 'Mexican', 'Greek', 'Thai', 'Indian', 'British', 'Japanese', 'Middle Eastern'];
      var genericImg = 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=200&h=200&fit=crop';

      for (var i = 0; i < TOTAL; i++) {
        var num = i + 1;
        var available = i < AVAILABLE_COUNT ? 'Yes' : 'No';
        var item;
        if (i < BASE.length) {
          item = BASE[i];
        } else {
          item = {
            name: 'Menu Item ' + num,
            desc: "Chef's special. Fresh ingredients, made to order. Popular choice.",
            veg: (i % 3 === 0) ? 'Yes' : 'No',
            cat: cats[i % cats.length],
            cuisine: cuisines[i % cuisines.length],
            price: '$' + (8 + (i % 7)) + '.' + (i % 2 === 0 ? '99' : '49'),
            img: genericImg,
            alt: 'Menu Item ' + num
          };
        }
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + num + '</td>' +
          '<td>' + escapeHtml(item.name) + '</td>' +
          '<td>' + escapeHtml(item.desc) + '</td>' +
          '<td>' + available + '</td>' +
          '<td>' + (item.veg || 'No') + '</td>' +
          '<td>' + escapeHtml(item.cat) + '</td>' +
          '<td>' + escapeHtml(item.cuisine) + '</td>' +
          '<td>' + escapeHtml(item.price) + '</td>' +
          '<td><img src="' + escapeAttr(item.img) + '" alt="' + escapeAttr(item.alt || item.name) + '" /></td>' +
          '<td class="buttons"><a href="form_fooditem.html?id=' + num + '"><button type="button">Edit</button></a></td>';
        tbody.appendChild(tr);
      }

      function escapeHtml(s) {
        if (s == null) return '';
        var div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }
      function escapeAttr(s) {
        if (s == null) return '';
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }
    })();
  </script>
  <script src="JS/table-search.js"></script>
  <script src="JS/back-to-top.js"></script>
</body>
</html>
