<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Order Request</title>
  <link rel="stylesheet" href="edit-id.css">
</head>

<body>
  <header class="header">
    <div class="logo">
      <img src="chefchain-image.png" alt="ChefChain Logo" />
    </div>
    <nav class="menu">
      <button class="menu-btn dropbtn" onclick="window.location.href='admindashbord.html'">Dashboard</button>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Food Items</button>
        <div class="dropdown-content">
          <a href="list_fooditems.html">View Food Items</a>
          <a href="add_fooditem.html">Add Food Item</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Cuisines</button>
        <div class="dropdown-content">
          <a href="list_cuisines.html">View Cuisines</a>
          <a href="add_cuisine.html">Add Cuisine</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Categories</button>
        <div class="dropdown-content">
          <a href="list_categories.html">View Categories</a>
          <a href="add_category.html">Add Category</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Restaurants</button>
        <div class="dropdown-content">
          <a href="list_restaurants.html">View Restaurants</a>
          <a href="add_restaurant.html">Add Restaurant</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn active">Orders</button>
        <div class="dropdown-content">
          <a href="orders.html">View Orders</a>
          <a href="order-request.html">Request Order</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Users</button>
        <div class="dropdown-content">
          <a href="users.html">View Users</a>
          <a href="add_user.html">Add User</a>
        </div>
      </div>
    </nav>
    <div class="auth-buttons">
      <button class="signin" type="button" onclick="window.location.href='sign-in.html'">Sign In</button>
      <button class="signout" type="button" onclick="window.location.href='sign-in.html'">Sign Out</button>
    </div>
  </header>

  <h1>Order Request</h1>

  <form action="info-saved.html?redirect=orders.html" method="post" id="survey-form">
    <div class="form">
      <p>
        <label for="order-id">Order ID</label>
        <input id="order-id" type="text" placeholder="Enter ID" style="font-family: 'Times New Roman', serif;" required/>
      </p>
    </div>

    <div class="form">
      <p>
        <label for="order-content">Order Content</label>
        <input id="order-content" type="text" placeholder="Enter contents" style="font-family: 'Times New Roman', serif;" required/>
      </p>
    </div>

    <div class="form">
      <p>
        <label for="date">Order Date</label>
        <input type="date" id="date" name="date" style="font-family: 'Times New Roman', serif;" min="2025-10-01">
      </p>
    </div>

    <div class="form">
      <p>
        <label for="order-status">Order Status</label>
        <select id="order-status" name="order-status" style="font-family: 'Times New Roman', serif;">
          <option value="Delivered">Delivered</option>
          <option value="Pending Delivery">Pending Delivery</option>
          <option value="Not Delivered">Not Delivered</option>
        </select>
      </p>
    </div>

    <div class="form">
      <p>
        <label for="quantity">Quantity</label>
        <input id="quantity" type="number" size="40" style="font-family: 'Times New Roman', serif;" />
      </p>
    </div>

    <div class="buttons">
      <p>
        <button type="reset">Discard</button>
        <button type="submit">Save</button>
      </p>
    </div>
  </form>
</body>
</html>
