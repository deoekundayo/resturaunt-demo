    </div>
    <nav class="menu">
      <button class="menu-btn dropbtn" onclick="window.location.href='admindashbord.html'">Dashboard</button>
      
      <div class="dropdown">
        <button class="menu-btn dropbtn">Food Items</button>
        <div class="dropdown-content">
          <a href="list_fooditems.html">View Food Items</a>
          <a href="add_fooditem.html">Add Food Item</a>
        </div>
      </div>
      
      <div class="dropdown">
        <button class="menu-btn dropbtn">Cuisines</button>
        <div class="dropdown-content">
          <a href="list_cuisines.html">View Cuisines</a>
          <a href="add_cuisine.html">Add Cuisine</a>
        </div>
      </div>
      
      <div class="dropdown">
        <button class="menu-btn dropbtn">Categories</button>
        <div class="dropdown-content">
          <a href="list_categories.html">View Categories</a>
          <a href="add_category.html">Add Category</a>
        </div>
      </div>
      
      <div class="dropdown">
        <button class="menu-btn dropbtn">Restaurants</button>
        <div class="dropdown-content">
          <a href="list_restaurants.html">View Restaurants</a>
          <a href="add_restaurant.html">Add Restaurant</a>
        </div>
      </div>
      
      <div class="dropdown">
        <button class="menu-btn dropbtn active">Orders</button>

          <a href="orders.html">View Orders</a>

        </div>
      </div>
      
      <div class="dropdown">
        <button class="menu-btn dropbtn">Users</button>

        </div>

    </nav>
    <div class="auth-buttons">
      <button class="signin" type="button">Sign In</button>
      <button class="signout" type="button">Sign Out</button>
    </div>
 
  </header>
  <form action="info-saved.html" method="post"> 
  <h1>Order Request</h1>
  

  <form id="survey-form">

    <div class="form">
      <p>
        <label for="name">Order ID</label>
        <input id="name" type="text" placeholder="Enter ID" style="font-family: 'Times New Roman', serif;" required/>
      </p>
    </div>
    <div class="form">
        <p>
          <label for="name">Order Content</label>
          <input id="name" type="text" placeholder="Enter contents" style="font-family: 'Times New Roman', serif;" required/>
        </p>
      </div>

    <div class="form">
      <p>
        <label for="description">Order Date</label>
        <input type="date" id="date" name="date" style="font-family: 'Times New Roman', serif;"
        min="2025-10-01">

      </p>
    </div>

    <div class="form">
      <p>
        <label for="order-status">Order Status</label>
        <input id="order-status" type="text" placeholder="order-status" size="40" style="font-family: 'Times New Roman', serif;" />
      </p>
    </div>

    <div class="form">
      <p>
        <label for="quantity">Quantity</label>
        <input id="quantity" type="number" size="40" style="font-family: 'Times New Roman', serif;" />
        
      </p>
    </div>

    <div class="buttons">
      <p>
        <button type="reset">Discard</button>
        <button type="submit">Save</button>
      </p>
    </div>

  </form>
</body>

</html>
