<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Edit Food Item</title>
    <link rel="stylesheet" href="form-styles.css" />
    <!-- Optional: make buttons in the header not submit the form -->
  </head>

  <body>
    <!-- Header (outside the form) -->
    <header class="header">
      <div class="logo">
        <!-- If this image doesn't show, ensure the file name/path is correct. Avoid spaces or URL-encode them. -->
        <img src="chefchain-image.png" alt="ChefChain Logo" />
        
      </div>
      <nav class="menu">
        <button class="menu-btn dropbtn" onclick="window.location.href='admindashbord.html'">Dashboard</button>
        
        <div class="dropdown">
          <button class="menu-btn dropbtn active">Food Items</button>
          <div class="dropdown-content">
            <a href="list_fooditems.html">View Food Items</a>
            <a href="add_fooditem.html">Add Food Item</a>
          </div>
        </div>
        
        <div class="dropdown">
          <button class="menu-btn dropbtn">Cuisines</button>
          <div class="dropdown-content">
            <a href="list_cuisines.html">View Cuisines</a>
            <a href="add_cuisine.html">Add Cuisine</a>
          </div>
        </div>
        
        <div class="dropdown">
          <button class="menu-btn dropbtn">Categories</button>
          <div class="dropdown-content">
            <a href="list_categories.html">View Categories</a>
            <a href="add_category.html">Add Category</a>
          </div>
        </div>
        
        <div class="dropdown">
          <button class="menu-btn dropbtn">Restaurants</button>
          <div class="dropdown-content">
            <a href="list_restaurants.html">View Restaurants</a>
            <a href="add_restaurant.html">Add Restaurant</a>
          </div>
        </div>
        
        <div class="dropdown">
          <button class="menu-btn dropbtn">Orders</button>
          <div class="dropdown-content">
            <a href="orders.html">View Orders</a>
            <a href="order-request.html">Request Order</a>
          </div>
        </div>
        
        <div class="dropdown">
          <button class="menu-btn dropbtn">Users</button>
          <div class="dropdown-content">
            <a href="users.html">View Users</a>
            <a href="add_user.html">Add User</a>
          </div>
        </div>
      </nav>
      <div class="auth-buttons">
        <button class="signin" type="button">Sign In</button>
        <button class="signout" type="button">Sign Out</button>
      </div>
    </header>

    <main>
      <h1>Add Food Item</h1>

      <!-- Single form (no nesting) -->
      <form id="survey-form" action="info-saved.html" method="post">
        <div class="form">
          <p>
            <label for="name">Food Item Name</label>
            <input
              id="name"
              name="name"
              type="text"
              value="Pizza"
              required
              style="font-family: 'Times New Roman', serif"
            />
          </p>
        </div>

        <div class="form">
          <p>
            <label for="description">Food Item Description</label>
            <textarea
              id="description"
              name="description"
              rows="9"
              cols="40"
              required
              style="font-family: 'Times New Roman', serif"
            >
A classic favorite topped with rich tomato sauce, melted mozzarella cheese, and generous slices of spicy pepperoni. Baked to perfection with a golden crust for the perfect balance of savory and crispy in every bite.</textarea
            >
          </p>
        </div>

        <div class="form">
          <p>
            <label for="image-url">Image URL</label>
            <input
              id="image-url"
              name="image_url"
              type="url"
              size="40"
              style="font-family: 'Times New Roman', serif"
              value="https://encrypted-tbn2.gstatic.com/shopping?q=tbn:ANd9GcRDyJEalW-IRBh84gsK2fYUAUhWTgBjSK8WyD62a7Q7UgyEdg-yunD5cZNmJn23BGetNNsAnG6AGF4bfPU4Le5VcwkBIUhK5iqZRbdzAUUb&usqp=CAc"
            />
          </p>
        </div>

        <div class="form">
          <p>
            <label for="category">What category is this food item?</label>
            <select id="category" name="category" required>
              <option>Pasta</option>
              <option value="Pizza" selected>Pizza</option>
              <option>Burger</option>
              <option>Milkshake</option>
            </select>
          </p>
        </div>

        <div class="form">
          <p>
            <label for="cuisine">What cuisine is this food item?</label>
            <select id="cuisine" name="cuisine" required>
              <option value="Italian" selected>Italian</option>
              <option>American</option>
              <option>Chinese</option>
              <option>Nigerian</option>
            </select>
          </p>
        </div>

        <div class="form">
          <p>
            <span>Is this item currently available?</span>
            <!-- Give radios unique IDs; associate labels with matching IDs -->
            <input
              id="availability-yes"
              type="radio"
              name="availability"
              value="yes"
              required
              checked
            />
            <label for="availability-yes" style="font-weight: normal"
              >Yes</label
            >

            <input
              id="availability-no"
              type="radio"
              name="availability"
              value="no"
            />
            <label for="availability-no" style="font-weight: normal">No</label>
          </p>
        </div>

        <div class="form">
          <p>
            <span>Does this item have a vegetarian option?</span>
            <input
              id="vegetarian-yes"
              type="radio"
              name="vegetarian"
              value="yes"
              required
            />
            <label for="vegetarian-yes" style="font-weight: normal">Yes</label>

            <input
              id="vegetarian-no"
              type="radio"
              name="vegetarian"
              value="no"
              checked
            />
            <label for="vegetarian-no" style="font-weight: normal">No</label>
          </p>
        </div>

        <div class="buttons">
          <p>
            <button type="reset">Discard</button>
            <button type="submit">Save</button>
          </p>
        </div>
      </form>
    </main>

  </body>
</html>
