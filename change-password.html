<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password - ChefChain</title>
  <link rel="stylesheet" href="form-styles.css">
  <style>
    .change-password-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 100px);
      padding: 20px;
    }
    
    .change-password-form {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      max-width: 450px;
      padding: 40px;
      width: 100%;
    }
    
    .change-password-form h1 {
      margin-bottom: 30px;
      color: #333;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #444;
      font-weight: 600;
      text-align: left;
      font-family: "Times New Roman", serif;
    }
    
    .form-group input[type="text"],
    .form-group input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      box-sizing: border-box;
      font-family: "Times New Roman", serif;
      font-size: 16px;
    }
    
    .form-group input[type="text"]:focus,
    .form-group input[type="password"]:focus {
      border: 2px solid #4caf50;
      outline: none;
    }
    
    #message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 5px;
      text-align: center;
      font-family: "Times New Roman", serif;
      font-size: 14px;
    }
    
    .change-password-button {
      width: 100%;
      padding: 12px;
      background-color: #4caf50;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      font-family: "Times New Roman", serif;
      transition: background-color 0.3s ease;
    }
    
    .change-password-button:hover {
      background-color: #45a049;
    }
    
    .change-password-button:active {
      transform: scale(0.98);
    }
    
    .cancel-button {
      width: 100%;
      padding: 12px;
      background-color: #333;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      font-family: "Times New Roman", serif;
      transition: background-color 0.3s ease;
      margin-top: 10px;
    }
    
    .cancel-button:hover {
      background-color: #555;
    }
    
    .cancel-button:active {
      transform: scale(0.98);
    }
    
    @media (max-width: 480px) {
      .change-password-form {
        padding: 30px 20px;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="logo">
      <img src="chefchain-image.png" alt="ChefChain Logo" />
    </div>
    <div class="auth-buttons">
      <button class="signin" type="button" onclick="window.location.href='sign-in.html'">Sign In</button>
      <button class="signout" type="button" onclick="window.location.href='sign-in.html'">Sign Out</button>
    </div>
  </header>

  <div class="change-password-container">
    <form id="changePasswordForm" class="change-password-form">
      <h1>Change Password</h1>
      
      <div class="form-group">
        <label for="userId">User ID</label>
        <input 
          type="text" 
          id="userId" 
          name="userId" 
          placeholder="Enter your User ID" 
          required 
          autocomplete="username"
        />
      </div>
      
      <div class="form-group">
        <label for="currentPassword">Current Password</label>
        <input 
          type="password" 
          id="currentPassword" 
          name="currentPassword" 
          placeholder="Enter your current password" 
          required 
          autocomplete="current-password"
        />
      </div>
      
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input 
          type="password" 
          id="newPassword" 
          name="newPassword" 
          placeholder="Enter your new password" 
          required 
          autocomplete="new-password"
        />
        <div class="password-requirements">
          <p style="font-size: 12px; color: #666; margin-top: 5px; margin-bottom: 0;">Password must contain:</p>
          <ul style="font-size: 12px; color: #666; margin: 5px 0 0 20px; padding: 0;">
            <li>Minimum 6 characters</li>
            <li>At least 1 number</li>
            <li>At least 1 special character</li>
          </ul>
        </div>
      </div>
      
      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>
        <input 
          type="password" 
          id="confirmPassword" 
          name="confirmPassword" 
          placeholder="Confirm your new password" 
          required 
          autocomplete="new-password"
        />
      </div>
      
      <div id="message"></div>
      
      <button type="submit" class="change-password-button">Change Password</button>
      <button type="button" onclick="window.location.href='sign-in.html'" class="cancel-button">Cancel</button>
    </form>
  </div>

  <script src="JS/change-password.js"></script>
</body>
</html>
