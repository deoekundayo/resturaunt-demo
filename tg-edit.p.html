<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit Restaurant</title>
  <link rel="stylesheet" href="form-styles.css">
</head>

<body>
  <header class="header">
    <div class="logo">
      <img src="chefchain-image.png" alt="ChefChain Logo" />
    </div>
    <nav class="menu">
      <button class="menu-btn dropbtn" onclick="window.location.href='admindashbord.html'">Dashboard</button>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Food Items</button>
        <div class="dropdown-content">
          <a href="list_fooditems.html">View Food Items</a>
          <a href="add_fooditem.html">Add Food Item</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Cuisines</button>
        <div class="dropdown-content">
          <a href="list_cuisines.html">View Cuisines</a>
          <a href="add_cuisine.html">Add Cuisine</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Categories</button>
        <div class="dropdown-content">
          <a href="list_categories.html">View Categories</a>
          <a href="add_category.html">Add Category</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn active">Restaurants</button>
        <div class="dropdown-content">
          <a href="list_restaurants.html">View Restaurants</a>
          <a href="add_restaurant.html">Add Restaurant</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Orders</button>
        <div class="dropdown-content">
          <a href="orders.html">View Orders</a>
          <a href="order-request.html">Request Order</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Users</button>
        <div class="dropdown-content">
          <a href="users.html">View Users</a>
          <a href="add_user.html">Add User</a>
        </div>
      </div>
    </nav>
    <div class="auth-buttons">
      <button class="signin" type="button" onclick="window.location.href='sign-in.html'">Sign In</button>
      <button class="signout" type="button" onclick="window.location.href='sign-in.html'">Sign Out</button>
    </div>
  </header>

  <h1>Edit Restaurant</h1>

  <form action="info-saved.html?redirect=list_restaurants.html" method="post" id="survey-form">
    <div class="form">
      <p>
        <label for="name">Restaurant Name</label>
        <input id="name" type="text" value="The Grill" required style="font-family: 'Times New Roman', serif;"/>
      </p>
    </div>

    <div class="form">
      <p>
        <label for="address">Restaurant Address</label>
        <input id="address" type="text" value="2737 North Stockton boulevard Atlanta, GA" required style="font-family: 'Times New Roman', serif;"/>
      </p>
    </div>

    <div class="form">
      <p>
        <label for="image-url">Image URL</label>
        <input id="image-url" type="url" value="https://assets.bonappetit.com/photos/57d6d72babffea600db60d74/master/pass/tbd-restaurant-grillworks.jpg" style="font-family: 'Times New Roman', serif;" size="40"/>
      </p>
    </div>

    <div class="form">
      <p>
        <label for="phone-number">Phone Number</label>
        <input id="phone-number" type="tel" value="404-295-9869" maxlength="14" required style="font-family: 'Times New Roman', serif;"/>
      </p>
    </div>

    <div class="buttons">
      <p>
        <button type="reset">Discard</button>
        <button type="submit">Save</button>
      </p>
    </div>
  </form>
  <script>
    document.getElementById("phone-number").addEventListener("input", function(e) {
      let x = e.target.value.replace(/\D/g, "");
      if (x.length > 0) {
        x = "(" + x;
      }
      if (x.length > 4) {
        x = x.slice(0, 4) + ")-" + x.slice(4);
      }
      if (x.length > 9) {
        x = x.slice(0, 9) + "-" + x.slice(9);
      }
      if (x.length > 14) {
        x = x.slice(0, 14);
      }
      e.target.value = x;
    });
  </script>
</body>
</html>
