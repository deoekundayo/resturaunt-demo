<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Food Item Form</title>
  <link rel="stylesheet" href="form-styles.css">
</head>

<body>
  <header class="header">
    <div class="logo">
      <img src="chefchain-image.png" alt="ChefChain Logo" />
    </div>
    <nav class="menu">
      <button class="menu-btn dropbtn" onclick="window.location.href='admindashbord.html'">Dashboard</button>

      <div class="dropdown">
        <button class="menu-btn dropbtn active">Food Items</button>
        <div class="dropdown-content">
          <a href="list_fooditems.html">View Food Items</a>
          <a href="form_fooditem.html">Add Food Item</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Cuisines</button>
        <div class="dropdown-content">
          <a href="list_cuisines.html">View Cuisines</a>
          <a href="form_cuisine.html">Add Cuisine</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Categories</button>
        <div class="dropdown-content">
          <a href="list_categories.html">View Categories</a>
          <a href="form_category.html">Add Category</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Restaurants</button>
        <div class="dropdown-content">
          <a href="list_restaurants.html">View Restaurants</a>
          <a href="form_restaurant.html">Add Restaurant</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Orders</button>
        <div class="dropdown-content">
          <a href="orders.html">View Orders</a>
          <a href="form_order.html">Request Order</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Users</button>
        <div class="dropdown-content">
          <a href="users.html">View Users</a>
          <a href="form_user.html">Add User</a>
        </div>
      </div>
    </nav>
    <div class="auth-buttons">
      <button class="signin" type="button" onclick="window.location.href='sign-in.html'">Sign In</button>
      <button class="signout" type="button" onclick="window.location.href='sign-in.html'">Sign Out</button>
    </div>
  </header>

  <h1>Add Food Item</h1>

  <form id="survey-form">
    <div class="form">
      <p>
        <label for="name">Food Item Name</label>
        <input id="name" type="text" placeholder="Enter name here" required style="font-family: 'Times New Roman', Times, serif;" />
      </p>
    </div>

    <div class="form">
      <p>
        <label for="description">Food Item Description</label>
        <textarea id="description" name="description" placeholder="Enter description here" rows="2" cols="40" required style="font-family: 'Times New Roman', Times, serif;"></textarea>
      </p>
    </div>

    <div class="form">
      <p>
        <label for="image-url">Image URL</label>
        <input id="image-url" type="url" placeholder="Enter URL here" size="40" style="font-family: 'Times New Roman', Times, serif;"/>
      </p>
    </div>

    <div class="form">
      <p>
        <label for="category">What category is this food item?</label>
        <select id="category" name="category" required>
          <option value="" disabled selected>-- Select a category --</option>
        </select>
      </p>
    </div>

    <div class="form">
      <p>
        <label for="cuisine">What cuisine is this food item?</label>
        <select id="cuisine" name="cuisine" required>
          <option value="" disabled selected>-- Select a cuisine --</option>
        </select>
      </p>
    </div>

    <div class="form">
      <p>
        <label for="availability">Is this item currently available?</label>
        <input id="availability-yes" type="radio" value="yes" name="availability" required/>
        <label for="availability-yes" style="font-weight: normal;">Yes</label>
        <input id="availability-no" type="radio" value="no" name="availability"/>
        <label for="availability-no" style="font-weight: normal;">No</label>
      </p>
    </div>

    <div class="form">
      <p>
        <label for="vegetarian">Does this item have a vegetarian option?</label>
        <input id="veg-yes" type="radio" value="yes" name="vegetarian" required/>
        <label for="veg-yes" style="font-weight: normal;">Yes</label>
        <input id="veg-no" type="radio" value="no" name="vegetarian"/>
        <label for="veg-no" style="font-weight: normal;">No</label>
      </p>
    </div>

    <div class="buttons">
      <p>
        <button type="reset">Delete</button>
        <button type="submit">Save</button>
      </p>
    </div>
  </form>

  <script src="JS/food-items-data.js"></script>
  <script src="JS/utils.js"></script>
  <script src="JS/form-handlers.js"></script>
  <script>
    handleFoodItemForm();
  </script>
</body>
</html>
