<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users</title>
  <link rel="stylesheet" href="table.css">
  <link rel="stylesheet" href="back-to-top.css">
  <link rel="stylesheet" href="table-search.css">
</head>

<body>
  <header class="header">
    <div class="logo">
      <img src="chefchain-image.png" alt="ChefChain Logo"/>
    </div>
    <nav class="menu">
      <button class="menu-btn dropbtn" onclick="window.location.href='admindashbord.html'">Dashboard</button>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Food Items</button>
        <div class="dropdown-content">
          <a href="list_fooditems.html">View Food Items</a>
          <a href="add_fooditem.html">Add Food Item</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Cuisines</button>
        <div class="dropdown-content">
          <a href="list_cuisines.html">View Cuisines</a>
          <a href="add_cuisine.html">Add Cuisine</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Categories</button>
        <div class="dropdown-content">
          <a href="list_categories.html">View Categories</a>
          <a href="add_category.html">Add Category</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Restaurants</button>
        <div class="dropdown-content">
          <a href="list_restaurants.html">View Restaurants</a>
          <a href="add_restaurant.html">Add Restaurant</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn">Orders</button>
        <div class="dropdown-content">
          <a href="orders.html">View Orders</a>
          <a href="order-request.html">Request Order</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn dropbtn active">Users</button>
        <div class="dropdown-content">
          <a href="users.html">View Users</a>
          <a href="form_user.html">Add User</a>
        </div>
      </div>
    </nav>
    <div class="auth-buttons">
      <button class="signin" type="button" onclick="window.location.href='sign-in.html'">Sign In</button>
      <button class="signout" type="button" onclick="window.location.href='sign-in.html'">Sign Out</button>
    </div>
  </header>

  <main class="main">
    <h1>Users</h1>
    <div class="table-search-wrap">
      <input type="text" class="table-search-input" id="table-search" placeholder="Search by User ID, Name, Email, or Contact Number..." data-search-tbody="users-tbody" data-search-col="0,1,2,3" aria-label="Search users by User ID, Name, Email, or Contact Number">
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>User ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Contact Number</th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          <!-- Populated from users-data.js so User IDs match Orders table Client IDs -->
        </tbody>
      </table>
    </div>
  </main>

  <script src="JS/users-data.js"></script>
  <script>
    (function() {
      var tbody = document.getElementById('users-tbody');
      var list = window.USERS_LIST;
      if (!tbody || !list || !list.length) return;
      tbody.innerHTML = '';
      for (var i = 0; i < list.length; i++) {
        var u = list[i];
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + (u.id || '') + '</td>' +
          '<td>' + (u.name || '') + '</td>' +
          '<td><a href="mailto:' + (u.email || '').replace(/"/g, '&quot;') + '" style="color:#050505;">' + (u.email || '') + '</a></td>' +
          '<td><a href="tel:' + (u.contact || '').replace(/\D/g, '') + '" style="color:#050505;">' + (u.contact || '') + '</a></td>';
        tbody.appendChild(tr);
      }
    })();
  </script>
  <script src="JS/users-loader.js"></script>
  <script src="JS/delete-second-user.js"></script>
  <script src="JS/table-search.js"></script>
  <script src="JS/back-to-top.js"></script>
</body>
</html>
